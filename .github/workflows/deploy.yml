name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  CLUSTER: serviquick-prod-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.BACKEND_ECR }}:${{ github.sha }} .
          docker tag ${{ secrets.BACKEND_ECR }}:${{ github.sha }} ${{ secrets.BACKEND_ECR }}:latest
          docker push ${{ secrets.BACKEND_ECR }}:${{ github.sha }}
          docker push ${{ secrets.BACKEND_ECR }}:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${{ secrets.FRONTEND_ECR }}:${{ github.sha }} \
            ./client
          docker tag ${{ secrets.FRONTEND_ECR }}:${{ github.sha }} ${{ secrets.FRONTEND_ECR }}:latest
          docker push ${{ secrets.FRONTEND_ECR }}:${{ github.sha }}
          docker push ${{ secrets.FRONTEND_ECR }}:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service serviquick-prod-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service serviquick-prod-frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services serviquick-prod-backend \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services serviquick-prod-frontend \
            --region ${{ env.AWS_REGION }}
