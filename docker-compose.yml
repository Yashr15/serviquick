version: "3.9"

# ─────────────────────────────────────────────
#  ServiQuick – local development stack
#
#  Services
#    mongo    – MongoDB 7 (data volume for persistence)
#    backend  – Node.js/Express API  (port 4000)
#    frontend – React/Vite served by Nginx (port 80)
#
#  All three are on a private bridge network so they
#  can resolve each other by service name.
# ─────────────────────────────────────────────

networks:
  serviquick_net:
    driver: bridge

volumes:
  mongo_data:

services:
  # ── MongoDB ─────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: serviquick_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: serviquick
    volumes:
      - mongo_data:/data/db
    networks:
      - serviquick_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Only expose to host in dev; remove in production
    ports:
      - "27017:27017"

  # ── Backend (Node.js / Express) ──────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serviquick_backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      # Connects using the mongo service name on the internal network.
      # Credentials match the MONGO_INITDB_* values above.
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/serviquick?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-supersecretchangeme}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: "http://localhost"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - serviquick_net
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend (React → Nginx) ─────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Nginx proxies /api/* to backend:4000, so relative URL works inside Docker.
        VITE_API_URL: /api
    container_name: serviquick_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - serviquick_net
    ports:
      - "80:80"
